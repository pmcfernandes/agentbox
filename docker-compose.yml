services:
  # CLI & Agent Harness service
  agentbox:
    build:
      context: .
      target: base
    image: agentbox:latest
    container_name: agentbox
    restart: unless-stopped
    environment:
      - ENABLE_DOCKER=false
      - ENABLE_SSH=false
      - ENABLE_RDP=false
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - workspace_data:/workspace
      # Uncomment to share host Docker daemon instead of DinD:
      # - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "2222:22" # SSH (when ENABLE_SSH=true)
    stdin_open: true
    tty: true

  # GUI Desktop (XFCE + RDP) service
  agentbox-gui:
    build:
      context: .
      target: gui
    image: agentbox:gui
    container_name: agentbox-gui
    restart: unless-stopped
    environment:
      - ENABLE_DOCKER=false
      - ENABLE_SSH=false
      - ENABLE_RDP=true
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      - workspace_data:/workspace
    ports:
      - "2222:22"   # SSH (when ENABLE_SSH=true)
      - "3389:3389" # XRDP remote desktop
    stdin_open: true
    tty: true

volumes:
  workspace_data:
    name: agentbox_workspace
